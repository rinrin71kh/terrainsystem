apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
        - name: laravel-web
          image: thecodingmachine/php:8.2-v4-nginx
          # This image includes PHP 8.2 and Nginx. Good for quick Laravel demos.
          ports:
            - containerPort: 8080
            - containerPort: 22
          env:
            - name: APP_ENV
              value: "local"
            - name: APP_DEBUG
              value: "true"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "localhost"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "terrainsystem"   # <--- change this to your database name
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "Hello@123"
          volumeMounts:
            - name: laravel-code
              mountPath: /var/www/html
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: "terrainsystem"   # <--- change this to your database name
            - name: MYSQL_ROOT_PASSWORD
              value: "Hello@123"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: laravel-code
          hostPath:
            path: D:/FinalDevOps/terrainsystem # CHANGE THIS PATH to your actual local path if running Minikube/Docker Desktop, e.g. /mnt/c/Users/<you>/terrainsystem
        - name: mysql-data
          emptyDir: {}
