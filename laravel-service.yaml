apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: NodePort
  selector:
    app: laravel-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # Access via <NodeIP>:30080
    - port: 22
      targetPort: 22
      nodePort: 30220   # Access via <NodeIP>:30220
